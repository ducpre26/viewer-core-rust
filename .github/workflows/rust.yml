name: Rust infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      VIEWER_DATABASE_URL: postgresql://127.0.0.1:5432/viewer_rust
      VIEWER_DATABASE_USER: postgres
      VIEWER_DATABASE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: ikalnytskyi/action-setup-postgres@v8
        with:
          database: viewer_rust
          username: postgres
          password: ci-only-password
          postgres-version: '18'
      - run: rustup show
      - name: Build and verify packaged Java facade
        shell: bash
        run: python tools/facade.py build --java-home "$JAVA_HOME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p viewer-app --locked postgres_migrations_transaction_readiness_and_close -- --ignored
      - run: cargo build --workspace --release --locked
      - run: python tools/smoke_app.py --release
      - name: JNI and HTTP integration with explicit test limits
        shell: bash
        run: python tools/smoke_jni.py --java-home "$JAVA_HOME" --release --app
      - name: Save foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-03-${{ matrix.os }}
          path: |
            target/step-03-logs/
            java/dicom-facade/target/distribution/manifest.json
