[workspace]
members = ["crates/viewer-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
summer = "=0.7.2"
summer-web = { version = "=0.7.3", features = ["openapi"] }
summer-job = "=0.7.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.1"

