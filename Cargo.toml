[workspace]
members = ["crates/viewer-app", "crates/dicom-jvm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
summer = "=0.7.2"
summer-web = { version = "=0.7.3", features = ["openapi"] }
summer-job = "=0.7.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.1"


sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
url = "2"
jni = { version = "=0.21.1", features = ["invocation"] }
serde_json = "1"
sha2 = "0.10"
