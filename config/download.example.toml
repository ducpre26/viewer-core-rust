# Merge this section into the existing Summer profile; this file is not auto-loaded.
# Synthetic test values only, not approved production resource limits (P1–P4).
# DICOM/JPEG instance download works without JNI; JPEG uses store rendered frames.
# Study/series naming and MP4 need JNI. No Orthanc native library is used or packaged.
[download]
enabled = false
temp_dir = "/absolute/existing/download-temp"
max_jobs = 1
timeout_ms = 10000
max_input_bytes = 1048576
max_output_bytes = 1048576
max_job_bytes = 16777216
max_metadata_bytes = 1048576
max_entries = 100
max_frames = 100
# JPEG pixels per rendered frame; video pixels per DICOM object including frames.
# This does not promise a bound on total RSS.
max_pixels = 1048576
video_fps = 1
cleanup_ttl_seconds = 300
cleanup_interval_seconds = 60
